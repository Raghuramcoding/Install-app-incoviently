<!doctype html>
<html lang="en>
</head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oyasumi — Homelab Music Organizer</title>
<style>
    :root {
    --bg: #0d1117;
     --panel: #161b22;
     --accent: #4f8cff;
     --accent2: #2dd4a7;
     --text: #e6edf3;
     --muted: #8b949e;
     --border: #2d333b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: "Segoe UI", Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
    }
    nav {
    position: sticky; top: 0; z-index: 10;    
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    }
    nav .container { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
    .logo .dot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient
    (135deg, var(--accent), var(--accent2)); display: inline-flex; align-items: center; 
    justify-content: center; font-size: 14px; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 22px; font-size: .95rem; }
    nav a:hover { color: var(--text); }
    header { padding: 90px 0 70px; text-align: center; background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,140,255,.18), transparent); }
    .badge {
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(45,212,167,.12); color: var(--accent2); }
        border: 1px solid rgba(45,212,167,.35);
        padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; 
        margin-bottom: 24px;
    }
    .badge .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); 
    animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    header h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.15; margin-bottom: 18px; }
    header h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); 
    -webkit-background-clip: text; background-clip: text; color: transparent; }
    header p.sub { color: var(--muted); font-size: 1.15rem; max-width: 640px; margin: 0 auto 34px; }
    .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
        display: inline-block; padding: 12px 26px; border-radius: 10px; text-decoration: none;
        font-weight: 600; font-size: .98rem; transition: transform .15s, box-shadow .15s;
    }
     .btn:hover { transform: translateY(-2px); }
